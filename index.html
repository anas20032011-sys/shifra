.st-err{border-color:rgba(168,32,58,.6);background:linear-gradient(180deg,rgba(168,32,58,.2),rgba(168,32,58,.05))}.st-err .st-i{color:var(--red-tx);border-color:rgba(168,32,58,.6);background:var(--red-a)}.st-err .st-t{color:var(--red-tx)}
.st-info{border-color:var(--line-gold)}.st-info .st-i{color:var(--gold-hi);border-color:var(--line-gold)}
